<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards / フラッシュカード学習ツール</title>
<meta name="description" content="表裏のカードを自作して暗記学習。単語・用語・何でも覚えたいことに。">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4214020669195548"
     crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #12101c; --card: #1d1a2c; --text: #f4f2fa; --sub: #9c96b8;
    --accent: #a78bfa; --accent2: #4ade80; --danger: #fb7185; --border: #2a2640;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .home-link { font-size: 22px; text-decoration: none; line-height: 1; }
  .lang-btn { background: none; border: 1px solid var(--border); color: var(--sub); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  h1 { font-size: 21px; text-align: center; margin: 4px 0 4px; }
  .lead { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button {
    flex: 1; padding: 9px; border: 1px solid var(--border); border-radius: 8px;
    background: none; color: var(--sub); font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: var(--accent); color: #1a0f36; border-color: var(--accent); font-weight: bold; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  input[type="text"] { width: 100%; padding: 10px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; background: #150f22; color: var(--text); }
  .field { margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .add-btn { width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--accent); color: #1a0f36; font-weight: bold; cursor: pointer; }
  .card-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .card-list-item:last-child { border-bottom: none; }
  .card-list-item .remove { background: none; border: none; color: var(--sub); font-size: 16px; cursor: pointer; }
  .study-box {
    background: #150f22; border: 1px solid var(--border); border-radius: 14px; padding: 40px 20px;
    text-align: center; font-size: 20px; min-height: 100px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; margin-bottom: 12px;
  }
  .study-box .hint { font-size: 11px; color: var(--sub); position: absolute; margin-top: 60px; }
  .progress-label { text-align: center; font-size: 12px; color: var(--sub); margin-bottom: 10px; }
  .grade-row { display: none; gap: 10px; }
  .grade-row.show { display: flex; }
  .grade-row button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
  .grade-row .again-btn { background: var(--danger); color: #2b0a0f; }
  .grade-row .got-it-btn { background: var(--accent2); color: #06210f; }
  .empty-msg { text-align: center; color: var(--sub); font-size: 13px; padding: 20px 0; }
  .stats { text-align: center; font-size: 12px; color: var(--sub); margin-top: 10px; }
  .footer-links { text-align: center; font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.8; }
  .footer-links a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row"><a href="https://naginata-work.github.io/" class="home-link" title="All tools">🧰</a><button class="lang-btn" id="langBtn">EN</button></div>
  <h1 id="title">🗂️ フラッシュカード学習ツール</h1>
  <p class="lead" id="lead">表裏のカードを自作して、タップで暗記学習。</p>

  <div class="tabs">
    <button id="tabStudy" class="active"></button>
    <button id="tabManage"></button>
  </div>

  <div id="studyView">
    <div class="progress-label" id="progressLabel"></div>
    <div class="study-box" id="studyBox"></div>
    <div class="grade-row" id="gradeRow">
      <button class="again-btn" id="againBtn"></button>
      <button class="got-it-btn" id="gotItBtn"></button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div id="manageView" style="display:none;">
    <div class="card">
      <div class="field">
        <label id="frontLabel">表面(問題)</label>
        <input type="text" id="frontInput">
      </div>
      <div class="field">
        <label id="backLabel">裏面(答え)</label>
        <input type="text" id="backInput">
      </div>
      <button class="add-btn" id="addBtn"></button>
    </div>
    <div class="card" id="cardListCard">
      <div id="cardList"></div>
    </div>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="aboutTitle" style="font-size:15px; color:var(--text); margin:0 0 8px;"></h2>
    <p id="aboutBody1" style="margin:0 0 10px;"></p>
    <p id="aboutBody2" style="margin:0;"></p>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="faqTitle" style="font-size:15px; color:var(--text); margin:0 0 10px;"></h2>
    <p id="faq1Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq1A" style="margin:0 0 12px;"></p>
    <p id="faq2Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq2A" style="margin:0;"></p>
  </div>

  <p class="footer-links" id="footerLinks"></p>
  <p style="text-align:center; font-size:11px; color:var(--sub); margin-top:4px;">
    <a href="https://naginata-work.github.io/" style="color:var(--sub);" id="allToolsLink"></a> ・
    <a href="https://naginata-work.github.io/privacy.html" style="color:var(--sub);" id="privacyLink"></a>
  </p>
</div>

<script>
  const I18N = {
    ja: {
      title: '🗂️ フラッシュカード学習ツール',
      lead: '表裏のカードを自作して、タップで暗記学習。',
      tabStudy: '学習する',
      tabManage: 'カードを管理',
      frontLabel: '表面(問題)',
      backLabel: '裏面(答え)',
      addBtn: '+ カードを追加',
      tapToFlip: 'タップして裏面を見る',
      againBtn: 'もう一度',
      gotItBtn: '覚えた',
      progressLabel: (i, n) => `${i} / ${n} 枚目`,
      statsLabel: (got, again) => `覚えた: ${got} / もう一度: ${again}`,
      emptyMsg: 'カードがありません。「カードを管理」から追加してください。',
      finishedMsg: '全カード終了!もう一度学習するには再読み込みしてください。',
      removeConfirm: '削除しますか?',
      footerLinks: '他のツールも作っています → <a href="https://naginata-work.github.io/text-tools/" target="_blank" rel="noopener">文字数カウント</a> / <a href="https://naginata-work.github.io/habit-tracker/" target="_blank" rel="noopener">習慣トラッカー</a>',
      aboutTitle: 'フラッシュカード学習法について',
      aboutBody1: '英単語、資格試験の用語、歴史の年号など、「問題と答え」のペアを覚える暗記学習には、紙の単語カードをめくって確認する方法が昔から効果的とされています。このツールはその仕組みをそのままブラウザ上で再現しています。',
      aboutBody2: '「カードを管理」タブで表面(問題)と裏面(答え)を登録すると、「学習する」タブでカードがシャッフルされた順番で1枚ずつ出題されます。カードをタップすると答えが表示され、「覚えた」「もう一度」のどちらかを選ぶと次のカードに進みます。「もう一度」を選んだカードは、その回の最後にもう一度出題されます。',
      faqTitle: 'よくある質問',
      faq1Q: '登録したカードは保存される?',
      faq1A: 'はい。ブラウザに自動保存されるため、ページを閉じて後日開いても同じカードが残っています。別の端末とは共有されません。',
      faq2Q: '英単語以外の暗記にも使える?',
      faq2A: 'もちろんです。表面・裏面には好きな文字を自由に入力できるので、資格試験の用語、歴史の年号、プログラミングの構文など、どんな「問題と答え」のペアにも使えます。',
    },
    en: {
      title: '🗂️ Flashcards',
      lead: 'Make your own front/back cards and tap through them to memorize.',
      tabStudy: 'Study',
      tabManage: 'Manage cards',
      frontLabel: 'Front (question)',
      backLabel: 'Back (answer)',
      addBtn: '+ Add card',
      tapToFlip: 'Tap to reveal the back',
      againBtn: 'Again',
      gotItBtn: 'Got it',
      progressLabel: (i, n) => `Card ${i} of ${n}`,
      statsLabel: (got, again) => `Got it: ${got} / Again: ${again}`,
      emptyMsg: 'No cards yet. Add some from "Manage cards".',
      finishedMsg: 'Done with all cards! Reload the page to study again.',
      removeConfirm: 'Delete this card?',
      footerLinks: 'Also made these → <a href="https://naginata-work.github.io/text-tools/" target="_blank" rel="noopener">Text Counter</a> / <a href="https://naginata-work.github.io/habit-tracker/" target="_blank" rel="noopener">Habit Tracker</a>',
      aboutTitle: 'About flashcard-style learning',
      aboutBody1: "Memorizing vocabulary, exam terminology, historical dates, or any question-and-answer pair has long been done well with paper flashcards you flip through. This tool recreates that same process in the browser.",
      aboutBody2: 'Add a front (question) and back (answer) under "Manage cards," then switch to "Study" to go through them in a shuffled order. Tap a card to reveal the answer, then choose "Got it" or "Again" — cards marked "Again" come back around at the end of that session.',
      faqTitle: 'FAQ',
      faq1Q: 'Are my cards saved?',
      faq1A: "Yes, they're saved automatically in your browser, so they're still there if you close the page and come back later. They aren't shared across different devices.",
      faq2Q: 'Is this only for vocabulary?',
      faq2A: "Not at all. The front and back accept any text, so it works just as well for exam terms, historical dates, programming syntax, or any other question-and-answer pair you want to memorize.",
    }
  };

  function loadLang() { try { return localStorage.getItem('flashcardsLang'); } catch (e) { return null; } }
  function saveLang(l) { try { localStorage.setItem('flashcardsLang', l); } catch (e) {} }
  let lang = loadLang() === 'en' ? 'en' : 'ja';
  function t() { return I18N[lang]; }

  function loadCards() {
    try { return JSON.parse(localStorage.getItem('flashcardsData') || '[]'); } catch (e) { return []; }
  }
  function saveCards(cards) {
    try { localStorage.setItem('flashcardsData', JSON.stringify(cards)); } catch (e) {}
  }

  let cards = loadCards();
  let studyOrder = [];
  let studyIndex = 0;
  let flipped = false;
  let gotCount = 0;
  let againCount = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function resetStudy() {
    studyOrder = shuffle(cards.map((_, i) => i));
    studyIndex = 0;
    flipped = false;
    gotCount = 0;
    againCount = 0;
    renderStudy();
  }

  function renderStudy() {
    const box = document.getElementById('studyBox');
    const gradeRow = document.getElementById('gradeRow');
    const progress = document.getElementById('progressLabel');
    const stats = document.getElementById('stats');
    stats.textContent = t().statsLabel(gotCount, againCount);

    if (cards.length === 0) {
      box.textContent = t().emptyMsg;
      progress.textContent = '';
      gradeRow.classList.remove('show');
      return;
    }
    if (studyIndex >= studyOrder.length) {
      box.textContent = t().finishedMsg;
      progress.textContent = '';
      gradeRow.classList.remove('show');
      return;
    }
    const cur = cards[studyOrder[studyIndex]];
    progress.textContent = t().progressLabel(studyIndex + 1, studyOrder.length);
    box.textContent = flipped ? cur.back : (cur.front + '');
    gradeRow.classList.toggle('show', flipped);
  }

  document.getElementById('studyBox').addEventListener('click', () => {
    if (cards.length === 0 || studyIndex >= studyOrder.length) return;
    flipped = !flipped;
    renderStudy();
  });

  document.getElementById('gotItBtn').addEventListener('click', () => {
    gotCount++;
    studyIndex++;
    flipped = false;
    renderStudy();
  });
  document.getElementById('againBtn').addEventListener('click', () => {
    againCount++;
    studyOrder.push(studyOrder[studyIndex]);
    studyIndex++;
    flipped = false;
    renderStudy();
  });

  function renderCardList() {
    const list = document.getElementById('cardList');
    list.innerHTML = '';
    cards.forEach((c, idx) => {
      const row = document.createElement('div');
      row.className = 'card-list-item';
      row.innerHTML = `<span>${c.front} → ${c.back}</span><button class="remove">×</button>`;
      row.querySelector('.remove').addEventListener('click', () => {
        if (!confirm(t().removeConfirm)) return;
        cards.splice(idx, 1);
        saveCards(cards);
        renderCardList();
        resetStudy();
      });
      list.appendChild(row);
    });
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    const front = document.getElementById('frontInput').value.trim();
    const back = document.getElementById('backInput').value.trim();
    if (!front || !back) return;
    cards.push({ front, back });
    saveCards(cards);
    document.getElementById('frontInput').value = '';
    document.getElementById('backInput').value = '';
    renderCardList();
    resetStudy();
  });

  function setTab(tab, btnId) {
    ['tabStudy', 'tabManage'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(btnId).classList.add('active');
    document.getElementById('studyView').style.display = tab === 'study' ? 'block' : 'none';
    document.getElementById('manageView').style.display = tab === 'manage' ? 'block' : 'none';
    if (tab === 'study') resetStudy();
  }
  document.getElementById('tabStudy').addEventListener('click', () => setTab('study', 'tabStudy'));
  document.getElementById('tabManage').addEventListener('click', () => setTab('manage', 'tabManage'));

  function renderStaticText() {
    document.getElementById('title').textContent = t().title;
    document.getElementById('lead').textContent = t().lead;
    document.getElementById('tabStudy').textContent = t().tabStudy;
    document.getElementById('tabManage').textContent = t().tabManage;
    document.getElementById('frontLabel').textContent = t().frontLabel;
    document.getElementById('backLabel').textContent = t().backLabel;
    document.getElementById('addBtn').textContent = t().addBtn;
    document.getElementById('againBtn').textContent = t().againBtn;
    document.getElementById('gotItBtn').textContent = t().gotItBtn;
    document.getElementById('footerLinks').innerHTML = t().footerLinks;
    document.getElementById('aboutTitle').textContent = t().aboutTitle;
    document.getElementById('aboutBody1').textContent = t().aboutBody1;
    document.getElementById('aboutBody2').textContent = t().aboutBody2;
    document.getElementById('faqTitle').textContent = t().faqTitle;
    document.getElementById('faq1Q').textContent = t().faq1Q;
    document.getElementById('faq1A').textContent = t().faq1A;
    document.getElementById('faq2Q').textContent = t().faq2Q;
    document.getElementById('faq2A').textContent = t().faq2A;
    document.getElementById('allToolsLink').textContent = lang === 'ja' ? '他のツール一覧' : 'All tools';
    document.getElementById('allToolsLink').href = 'https://naginata-work.github.io/';
    document.getElementById('privacyLink').textContent = lang === 'ja' ? 'プライバシーポリシー' : 'Privacy policy';
    document.getElementById('privacyLink').href = 'https://naginata-work.github.io/privacy.html';
    renderCardList();
    renderStudy();
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    saveLang(lang);
    document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
    renderStaticText();
  });

  document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
  function hasSeeded() { try { return localStorage.getItem('flashcardsSeeded') === '1'; } catch (e) { return true; } }
  function markSeeded() { try { localStorage.setItem('flashcardsSeeded', '1'); } catch (e) {} }
  if (cards.length === 0 && !hasSeeded()) {
    cards = [
      { front: 'Hello', back: 'こんにちは' },
      { front: 'Thank you', back: 'ありがとう' },
      { front: 'Good morning', back: 'おはよう' }
    ];
    saveCards(cards);
    markSeeded();
  }
  resetStudy();
  renderStaticText();
</script>
</body>
</html>
